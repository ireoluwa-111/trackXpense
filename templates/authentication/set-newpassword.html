{% extends 'base_auth.html' %}
{% block content %}
<div class="card shadow-sm p-4" style="width: 380px; margin: 60px auto;">
  <h4 class="text-center mb-3">Set a New Password</h4>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-success w-100 mt-3">Change Password</button>
  </form>
</div>
{% endblock %}
