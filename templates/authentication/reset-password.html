
{% extends 'base_auth.html' %}
{% block content %}
<div class="card shadow-sm p-4" style="width: 380px; margin: 60px auto;">
  <h4 class="text-center mb-3">Forgot Password?</h4>
  <p class="text-muted text-center mb-4">Enter your email to receive a reset link.</p>

  <form method="post">
    {% csrf_token %}
    {{ form.email.label_tag }}
    {{ form.email }}
    <button type="submit" class="btn btn-primary w-100 mt-3">Send Reset Link</button>
  </form>
</div>
{% endblock %}
